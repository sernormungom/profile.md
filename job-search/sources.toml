# Where jobsearch.py collects ads. Add a [[source]] block to search a new site.
# Bookmark decisions, coverage evidence and revisit limits: source-review.md.
#
# Every source needs: id (unique), site (ads with the same site and ad ID are the same ad,
# even when two sources find them), type, and the fields that type uses:
#   rss      feeds = [...]                fixed RSS URLs (SuccessFactors, Teamtailor /jobs.rss), and/or
#            search_url, query,           a search feed ({q} = query); SuccessFactors caps each feed at
#            split_terms = [...]          20 items, so a full feed is split on split_terms until complete
#   pages    file = "inbox/....txt"       one ad URL per line; content_class = CSS class of the ad body
#   jobtech  queries = [...]              Platsbanken free-text queries (JobTech JobSearch API)
#            params = { ... }             extra API parameters sent with every query, e.g. municipality
#                                         codes (a list repeats the parameter)
#   workday  api_url, careers_url          public CXS tenant/site API and public careers base URL;
#            applied_facets = { ... }     listing facets verified against the official board
#   successfactors search_url             fixed server-rendered search URL; discovers every result,
#                                         paginates startrow and reads full microdata job pages
#   folder   path = "inbox/..."           .md/.txt files, one ad per file, saved by hand
# Optional: employer, location_regex (drop ads whose location does not match), exclude_title = [...],
# exclude_employer = [...] (regexes on the advertiser's name), exclude_text = [...] with text_exceptions
# (regexes on the ad body; a match next to an exception word, e.g. "meriterande", is ignored). The exclude_*
# lists are also allowed under [filters]. After changing any filter, run `refilter` to apply it to ads already
# in the index (fetch only filters ads it has not seen before).
# Missing locality remains unspecified and goes to screening; a known out-of-area locality is excluded.
# incremental = true (jobtech only: fetch only ads published since the last successful run),
# id_overrides = { "numeric-id" = "historical-id" } (rss only: preserve saved-page identities),
# enabled = false.
#
# Each site has its own query syntax, so the query is written here in the site's own terms and the
# adapter sends it unchanged. The index records which queries found each ad (`queries`).

[screening]
effort = "low"
# screen-cli: claude -p on the Claude subscription (no API charges).
cli_model = "haiku"
cli_parallel = 3            # ads screened at the same time
claude_command = "claude"   # else ~/.local/bin/claude, else the VS Code extension's binary
# batch-submit: Message Batches API, billed to an API account.
model = "claude-haiku-5-5"
max_tokens = 4096

[filters]
# Titles matching any of these are recorded but never screened.
exclude_title = [
  '(?i)\b(thesis|exjobb|examensarbete|internship|intern|trainee|graduate program|summer|sommarjobb|praktik|apprentice|student)\b',
]

[[source]]
id = "volvo-group-rss"
site = "volvo-group"
type = "rss"
employer = "Volvo Group"
location_regex = '(?i)g(ö|o|&#xf6;)teborg|gothenburg|hisings backa|torslanda|mölndal|partille|kungälv|lerum|härryda|mölnlycke'
# Every Göteborg ad except thesis/graduate ones. The feed returns at most 20 items and cannot be
# paged, so the script splits the query on split_terms until each part is under the cap.
# Syntax: a plain word matches the whole ad text, "title:word" matches the title only (stemmed, so
# title:developer also matches "development"). "-title:word" excludes by title, which keeps real jobs
# that merely mention thesis, student or intern in their body. "title:Göteborg" does not work: the
# location is not part of the indexed title, so Göteborg stays a full-text term.
search_url = "https://jobs.volvogroup.com/services/rss/job/?locale=en_GB&keywords={q}"
query = "(Göteborg) -title:thesis -title:graduate -title:student -title:internship -title:intern -title:trainee -title:apprentice -title:exjobb -title:examensarbete -title:sommarjobb -title:praktik"
split_terms = ["title:engineer", "title:manager", "title:software", "title:lead", "title:data", "title:specialist", "title:developer"]

[[source]]
id = "platsbanken-gbg"
site = "platsbanken"
type = "jobtech"
location_regex = '(?i)göteborg|mölndal|partille|kungälv|lerum|härryda'
max_per_query = 200
# After the first run, ask only for ads published since the last successful fetch (a day of overlap).
# `fetch --full` ignores this and asks for everything.
incremental = true
# Free-text queries over the whole ad. Location is a server-side filter (SCB municipality codes:
# Göteborg, Mölndal, Partille, Kungälv, Lerum, Härryda), not a word in the query.
params = { municipality = ["1480", "1481", "1402", "1482", "1441", "1401"] }
# Consultancies and staffing firms (direct employment only). Checked 2026-10-27 against their ads and
# the web. Oddwork and XLNT Search are recruiters, listed because their clients here are consultancies
# (Excipio, Bit Addict, Accenture). Combitech, an Mpya partner, is deliberately not listed.
exclude_employer = [
  '(?i)\b(capgemini|alten|mpya|knightec|hykmann|integro consulting|friday väst|oddwork|eccera|together tech)\b',
  '(?i)\b(avl mtc|bertrandt|sigma embedded|framtiden i sverige|tech talents|syntronic|knowit|nexer|edag)\b',
  '(?i)\b(afry|infotiv|xlnt search|veritaz|avatron|techrytera|software by quokka)\b',
  '(?i)\b(m for solutions|astek|mcub|ictech|castra)\b',
  # Consultancies the user decided not to apply to (see applications/applications.md).
  '(?i)\b(procruitment|agile resources|comatec)\b',
  # Consultancies the user has already sent a CV to (see applications/applications.md).
  '(?i)\b(black sheep recruitment|zool engineering)\b',
]
# Roles that are not engineering or software work. Tested on 208 screened ads: 34 hits, all skips.
exclude_title = [
  '(?i)\b(servicetekniker|supporttekniker|technical support|teknisk support|it support|kundtjänst\w*|produktionsmedarbetare)\b',
  '(?i)\b(underhåll\w*|drifttekniker|driftspecialist|felsökare|mekaniker|kyltekniker|montör|production engineer)\b',
  '(?i)\b(tekniker|\w+tekniker|lärare|inköp\w*|account manager|head of sales|verksamhetschef)\b',
  '(?i)\b(data engineer|business analyst)\b',
]
# Security/citizenship exclusions retained. Swedish-language requirements go to screening:
# the profile records advanced Swedish; fluency needs confirmation rather than a regex rejection.
# A match is ignored when text_exceptions appears within 150 characters (a merit, not a gate).
# Historical validation predates the language change (2026-10-29). Reasons remain in the index.
exclude_text = [
  '(?i)säkerhetsprövning|säkerhetsklass|säkerhetsskydd|försvarssekretess|skyddsklass|security clearance|säkerhetsprövad|registerkontroll',
  '(?i)svenskt medborgarskap|svensk medborgare|swedish citizen',
]
text_exceptions = '(?i)meriterande|\bplus\b|advantage|bonus|önskvärt|nice to have|preferred|fördel|vid behov'

queries = [
  "embedded",
  "simulink",
  "autosar",
  "c++",
  "ai engineer",
  "llm",
  # Bookmark review 2026-10-29: pilots found missed controls/automation managers.
  "aurobay",
  "RISE automation",
]
# Dropped after the first screening run: "medicinteknik mjukvara" and "reglerteknik" returned 56 ads that
# no other query found, and 55 of them were skips.

